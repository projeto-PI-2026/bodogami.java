<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
   
</head>
<body>
    <section>
        <aside class="container-navbar">
            <div class="navbar">
                <div class="navbar-alinhar">
                <img src="logo-bodogami.png" alt="" class="logo-bodogami-navbar">

                <button class="botao-jogos-navbar"> Jogos </button>
                </div>

            <p>Sair</p>
            </div>

        </aside>
    </section>

    <header >
    <section class="header">
        
            <div>
                <h2>  Jogos de Tabuleiro > Estoque </h2>
            </div>

            <div class="container-busca">

            <nav class="pesquisa">
                <i class="fa fa-search icone" aria-hidden="true"></i>
                <input type="text" name="" id=""  >
            </nav>

            <button class="botao-adicionar-jogo">Novo Jogo <i class="fa fa-plus" aria-hidden="true"></i></button>
            </div>

            <div id="modal-jogo" class="modal-overlay">
                <div class="modal-conteudo">

                    <span class="botao-fechar">&times;</span>
    
                    <h2>Adicionar Novo Jogo</h2>

                    <div class="separacao-div">
                    <label for="">
                        <p>Nome do Jogo</p> 
                        <input type="text" name="" id="">
                    </label>

                    <label for="">
                        <p>Descrição</p>
                        <input type="text" name="" id="">
                    </label>
                    </div>

                    <div class="separacao-div-3">
                    <label for="">
                        <p> Minimo de jogadores </p>
                        <input type="text" name="" id="">
                    </label>

                    <label for="">
                        <p>Máximo de jogadores </p>
                        <input type="text" name="" id="">
                    </label>
                    

                    <label for="">
                        <p>Tipo do Jogo</p>
                        <select name="" id="">
                            <option value="">RPG</option>
                            <option value="">Aventura</option>
                            <option value="">Terror</option>
                            <option value="">Ação</option>
                        </select>
                    </label>
                    </div>

                    
                    <div class="separacao-div">
                    <label for="">
                        <p>Editora</p>
                        <input type="text" name="" id="">
                    </label>

                    <label for="">
                        <p>Valor do Aluguel</p>
                        <input type="text" name="" id="">
                    </label>
                    </div>


                    <div class="separacao-div">
                    <label for=" ">
                        <p>Idade Mínima</p>
                        <input type="text" name="" id="">
                    </label>

                    <label for="">
                        <p>Valor do Aluguel Diária</p>
                        <input type="text" name="" id="">
                    </label>
                    </div>

                    <button class="botao-adicionar-jogo-modal">Adicionar Jogo </button>
                </div>
            </div>
        
    </section>
    </header>

    <main>
    <section>
        <div class="container-jogo">
            <img src="imagem-jogo.png" alt="">

            <div class="info-jogo">
                <p>Zombicide: Black Plague</p>
                <p>Qtd: 2</p>
            </div>

            <div class="botoes-jogo">
                <button class="botao-add-qtd"> <i class="fa fa-plus" aria-hidden="true"></i> </button>
                <button class="botao-remove-qtd"> <i class="fa fa-minus" aria-hidden="true"></i> </button>
                <button class="botao-deleta-jogo"> Deletar Jogo </button>
            </div>
        </div>
    </section>
    </main>

     <script src="script.js"></script>
</body>
</html>
