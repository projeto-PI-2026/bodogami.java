<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
   
</head>
<body>
    <section>
        <aside class="container-navbar">
            <div class="navbar">
            <div class="navbar-alinhar">
            <img src="logo-bodogami.png" alt="" class="logo-bodogami-navbar">

            <button class="botao-jogos-navbar"> Jogos </button>
            </div>

            <p>Sair</p>
            </div>

            

        </aside>
    </section>

    <header >
    <section class="header">
        
            <div>
                <h2>  Jogos de Tabuleiro > Estoque </h2>
            </div>

            <div class="container-busca">

            <nav class="pesquisa">
                <i class="fa fa-search icone" aria-hidden="true"></i>
                <input type="text" name="" id="input-pesquisa"  >
            </nav>

            <button class="botao-adicionar-jogo">Novo Jogo <i class="fa fa-plus" aria-hidden="true"></i></button>
            </div>

            <div id="modal-jogo" class="modal-overlay">
                <div class="modal-conteudo" id="conteudo">

                    <span class="botao-fechar">&times;</span>
    
                    <h2>Adicionar Novo Jogo</h2>

                    <div class="separacao-div">
                    <label for="">
                        <p>Nome do Jogo</p> 
                        <input type="text" name="" id="nome-jogo">
                    </label>

                    <label for="">
                        <p>Descrição</p>
                        <input type="text" name="" id="descricao-jogo">
                    </label>
                    </div>

                    <div class="separacao-div-3">
                    <label for="">
                        <p> Minimo de jogadores </p>
                        <input type="text" name="" id="minimo-jogadores">
                    </label>

                    <label for="">
                        <p>Máximo de jogadores </p>
                        <input type="text" name="" id="maximo-jogadores">
                    </label>
                    

                    <label for="">
                        <p>Tipo do Jogo</p>
                        <select name="" id="selecionar-tipo-jogo">
                            <option value="1">RPG</option>
                            <option value="2">Aventura</option>
                            <option value="3">Terror</option>
                            <option value="4">Ação</option>
                        </select>
                    </label>
                    </div>

                    
                    <div class="separacao-div">
                    <label for="">
                        <p>Editora</p>
                        <input type="text" name="" id="nome-editora">
                    </label>

                    <label for="">
                        <p>Valor do Aluguel</p>
                        <input type="text" name="" id="valor-aluguel">
                    </label>
                    </div>


                    <div class="separacao-div">
                    <label for=" ">
                        <p>Idade Mínima</p>
                        <input type="text" name="" id="idade-minima">
                    </label>

                    <label for="">
                        <p>Valor do Aluguel Diária</p>
                        <input type="text" name="" id="valor-diaria">
                    </label>
                    </div>

                    <button class="botao-adicionar-jogo-modal" id="adicionar-jogo">Adicionar Jogo </button>
                </div>
            </div>
        
    </section>
    </header>

    <main>
    <section id="container-lista-jogos">
       
    </section>
    </main>

     <script src="script.js"></script>
</body>
</html>
